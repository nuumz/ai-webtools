<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shell with the app in a frame</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #eef1f5; }
      .shell { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ccd; }
      .shell input { width: 220px; }
      iframe { width: 100%; height: 420px; border: 0; background: #fff; }
      label { display: block; font-size: 13px; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <!--
      The trap this fixture exists for: the shell around the app has a field
      with the SAME id as one inside the app. Filling "the page" writes both,
      and whichever frame answers first decides what the user is told. Naming
      the working frame is the only thing that tells them apart.
    -->
    <div class="shell">
      <label for="email">Shell search (not the app)</label>
      <input id="email" name="email" placeholder="shell field" />
    </div>
    <iframe id="app" title="The app under test"></iframe>
    <script>
      // `?cross=1` serves the inner app from another host, which is what a real
      // portal does — and the case where the top frame cannot read into it.
      const cross = new URLSearchParams(location.search).get('cross');
      const host = cross ? location.href.replace('localhost', '127.0.0.1') : location.href;
      document.getElementById('app').src = new URL('/demo/framed-app', host).href;
    </script>
  </body>
</html>
