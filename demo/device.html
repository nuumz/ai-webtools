<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>Device simulator fixture</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; background: #1e293b; }
      .chrome { color: #e2e8f0; padding: 8px 16px; display: flex; gap: 16px; }
      .device {
        width: 1024px;
        height: 720px;
        margin: 16px auto;
        border: 14px solid #0f172a;
        border-radius: 28px;
        overflow: hidden;
        background: #fff;
        /* The simulator scales the app down to fit the desk. */
        transform: scale(0.82);
        transform-origin: top center;
      }
      iframe { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <!--
      The app under test does not run in the tab: it runs in an iframe inside a
      device simulator, and the tab holds only the simulator's own chrome. Every
      screen check has to answer from the frame that actually paints the app.
    -->
    <div class="chrome">
      <span>Environment LOCALHOST</span>
      <span>Flow Mutual Fund</span>
      <span>Proposal ID ST-00000001</span>
    </div>
    <div class="device"><iframe id="app" title="Simulated device"></iframe></div>
    <script>
      // The simulator serves the app from its own host, so the frame is very
      // often cross-origin to the tab. `?cross=1` reproduces that here.
      const cross = new URLSearchParams(location.search).get('cross');
      const host = cross ? location.href.replace('localhost', '127.0.0.1') : location.href;
      document.getElementById('app').src = new URL('/demo/wizard', host).href;
    </script>
  </body>
</html>
