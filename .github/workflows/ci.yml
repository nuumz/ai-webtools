name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Catches stories that compile but blow up on render, which typecheck cannot see.
      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      # Playwright is deliberately not a devDependency, so a plain install stays
      # lean; CI adds it without touching the lockfile.
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Chromium only registers extension service workers with a display.
      - name: Loaded-extension tests
        run: xvfb-run -a npm run test:ext
